  <body class="body">
    <!-- Nav -->
    <input type="checkbox" id="m" class="no-checkbox" />
    <label for="m" class="menu">
      <div class="round-menu-holder">
        <img class="logo-image-mobile" src="images/logo.png" alt="⍰" />

      <div class="hamburger-menu">
        <img
          class="menu-text-hamburger"
          src="images/icons8-menu-50.png"
          alt="⍰"
        />
      </div>
    </label>
    <nav class="menu-box">
      <div class="menu-top-two-parts">
        <div class="menu-top">
          <img class="logo-image" src="images/logo.png" alt="⍰" />
          <h1>Robin Josef Šafařík</h1>
        </div>
        <div class="line-separating"></div>
        <button class="button-not-available">CZ</button>
        <button class="button-cz">EN</button>
      </div>

      <div class="menu-center">
        <a href="about-en.html" class="title-and-image">
          <div class="menu-text">About</div>
          <img
            class="small-flat-led-menu"
            src="images/led-off-trace.png"
            alt="A minimalistic icon of LED"
          />
          <img
            class="overlap-led"
            src="images/led-on-trace.png"
            alt="A minimalistic icon of LED"
          />
        </a>
        <a href="projects-en.html" class="title-and-image">
          <div class="menu-text">Projects</div>
          <img
            class="small-flat-led-menu"
            src="images/led-off-trace.png"
            alt="A minimalistic icon of LED"
          />
          <img
            class="overlap-led"
            src="images/led-on-trace.png"
            alt="A minimalistic icon of LED"
          />
        </a>

        <a href="contact-en.html" class="title-and-image">
          <div class="menu-text">Contact</div>
          <img
            class="small-flat-led-menu"
            src="images/led-off-trace.png"
            alt="A minimalistic icon of LED"
          />
          <img
            class="overlap-led"
            src="images/led-on-trace.png"
            alt="A minimalistic icon of LED"
          />
        </a>
        <div class="title-and-image">
          <div class="menu-text">Surveys</div>
          <div class="wrapper">
            <img
              class="led-on-indicating"
              src="images/led-on-trace.png"
              alt="A minimalistic icon of LED"
            />
            <img
              class="small-flat-led-menu"
              src="images/led-off-trace.png"
              alt="A minimalistic icon of LED"
            />
          </div>

          <img
            class="overlap-led-none"
            src="images/led-on-trace.png"
            alt="A minimalistic icon of LED"
          />
        </div>
      </div>
      <div class="menu-bottom">
        <div class="R-track">
          <img
            class="R-track"
            src="images/r-track-hole.png"
            alt="A minimalistic representation of a resistor"
          />
        </div>
        <div class="square-holder-pins">
          <div class="pad-text">+</div>
          <div class="pad-text">-</div>
          <div class="pad-menu-minus"></div>
          <div class="pad-menu-plus"></div>
        </div>
        <a href="update-logs.html" class="update-logs">Update logs</a>
        <div class="hole-round"></div>
      </div>
    </nav>

    <main class="main-page">
      <section class="container-survey">
        <!-- <img class="photo" src="images/Concours-Photo-CU..jpg" alt="Profile photo" /> -->

        <header class="header"></header>
        <p class="italic-text-gray" style="min-width: 50vw">
          Sorry, this page is avilable only in English at the moment.
        </p>
        <a href="survey-en.html" class="all-surveys">← All surveys</a>
        <div class="separator"></div>
        <iframe
          data-tally-src="https://tally.so/embed/gDeVJO?alignLeft=1&transparentBackground=1&dynamicHeight=1&formEventsForwarding=1"
          loading="lazy"
          width="100%"
          height="2688"
          frameborder="0"
          marginheight="0"
          marginwidth="0"
          title="Note-taking strategies "
        ></iframe>
        <script>
          var d = document,
            w = "https://tally.so/widgets/embed.js",
            v = function () {
              "undefined" != typeof Tally
                ? Tally.loadEmbeds()
                : d
                    .querySelectorAll("iframe[data-tally-src]:not([src])")
                    .forEach(function (e) {
                      e.src = e.dataset.tallySrc;
                    });
            };
          if ("undefined" != typeof Tally) v();
          else if (d.querySelector('script[src="' + w + '"]') == null) {
            var s = d.createElement("script");
            (s.src = w), (s.onload = v), (s.onerror = v), d.body.appendChild(s);
          }
        </script>

        <div class="separator"></div>
        <p
          class="pixel-info3"
          style="
            position: relative;
            align-items: center;
            justify-content: center;
          "
        >
          Probability of completing the survey:
          <strong id="probability">-- %</strong>
        </p>
        <script>
          function randomProbability() {
            // generuje číslo mezi 20 a 95
            return Math.floor(Math.random() * (95 - 60 + 1)) + 60;
          }

          function updateProbability() {
            document.getElementById("probability").textContent =
              randomProbability() + " %";
          }

          // inicializace
          updateProbability();

          // občasná změna (např. každých 5 sekund)
          setInterval(updateProbability, 5000);
        </script>
      </section>
      <div class="codswallop"></div>
      <div class="separator-bottom"></div>
      <div class="bottom-text">
        © 2025 Robin Josef Šafařík, all rights reserved.
      </div>
    </main>
  </body>
</html>
