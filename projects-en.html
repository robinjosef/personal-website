 <script>
  const canvas = document.getElementById('drawLayer');
  const ctx = canvas.getContext('2d');

  // Ostré vykreslení včetně HiDPI
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const cssW = document.documentElement.clientWidth;
    const cssH = window.innerHeight; // lépe reaguje na iOS bar změny

    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);

    // CSS velikost (vizuální)
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'green';
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Získání přesné pozice v canvasu
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    return { x, y };
  }

  let drawing = false;
  let last = { x: 0, y: 0 };

  function pointerDown(e) {
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);
    drawing = true;
    last = getPos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
  }

  function pointerMove(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }

  function pointerUp(e) {
    e.preventDefault();
    drawing = false;
    ctx.beginPath();
    try { canvas.releasePointerCapture?.(e.pointerId); } catch {}
  }

  // Jednotné události (fungují na myši i dotyku včetně iOS)
  canvas.addEventListener('pointerdown', pointerDown);
  canvas.addEventListener('pointermove', pointerMove);
  canvas.addEventListener('pointerup', pointerUp);
  canvas.addEventListener('pointerleave', pointerUp);
  canvas.addEventListener('pointercancel', pointerUp);

  // Volitelně: čištění
  window.clearCanvas = () => ctx.clearRect(0, 0, canvas.width, canvas.height);
</script>
